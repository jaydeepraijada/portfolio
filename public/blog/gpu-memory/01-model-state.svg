<svg viewBox="0 0 760 270" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="270" fill="#ffffff" stroke="#d0d0d0" stroke-width="1"/>
  <text x="380" y="34" text-anchor="middle" font-size="16" font-weight="600" fill="#111">Parameters + gradients + optimizer: a fixed 16P</text>

  <!-- stacked bar -->
  <rect x="40" y="70" width="680" height="58" fill="none" stroke="#111" stroke-width="2"/>
  <!-- parameters 4P -->
  <rect x="40" y="70" width="170" height="58" fill="#cfe3ff" stroke="#111" stroke-width="1.5"/>
  <text x="125" y="97" text-anchor="middle" font-size="12" font-weight="600" fill="#111">Parameters</text>
  <text x="125" y="114" text-anchor="middle" font-size="11" fill="#333">4P</text>
  <!-- gradients 4P -->
  <rect x="210" y="70" width="170" height="58" fill="#cfe9cf" stroke="#111" stroke-width="1.5"/>
  <text x="295" y="97" text-anchor="middle" font-size="12" font-weight="600" fill="#111">Gradients</text>
  <text x="295" y="114" text-anchor="middle" font-size="11" fill="#333">4P</text>
  <!-- optimizer 8P -->
  <rect x="380" y="70" width="340" height="58" fill="#ffe6b3" stroke="#111" stroke-width="1.5"/>
  <text x="550" y="97" text-anchor="middle" font-size="12" font-weight="600" fill="#111">Optimizer states (Adam)</text>
  <text x="550" y="114" text-anchor="middle" font-size="11" fill="#333">8P  =  momentum 4P  +  variance 4P</text>

  <text x="380" y="152" text-anchor="middle" font-size="12" fill="#555">does not depend on batch size or sequence length</text>

  <!-- activations, separate variable box -->
  <rect x="40" y="182" width="680" height="52" fill="#ffe0e0" stroke="#b33" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="380" y="205" text-anchor="middle" font-size="12" font-weight="600" fill="#a22">Activations</text>
  <text x="380" y="223" text-anchor="middle" font-size="11" fill="#a22">variable, grows with batch size and sequence length (this is the one that runs out)</text>
</svg>
