<svg viewBox="0 0 760 230" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="230" fill="#ffffff" stroke="#d0d0d0" stroke-width="1"/>
  <text x="380" y="32" text-anchor="middle" font-size="16" font-weight="600" fill="#111">FFN forward pass: what we keep for the backward pass</text>

  <!-- tensor boxes -->
  <!-- x -->
  <rect x="34" y="78" width="110" height="52" rx="6" fill="#cfe3ff" stroke="#111" stroke-width="1.5"/>
  <text x="89" y="102" text-anchor="middle" font-size="13" font-weight="600" fill="#111">x</text>
  <text x="89" y="120" text-anchor="middle" font-size="10.5" fill="#333">bsh</text>
  <!-- h -->
  <rect x="266" y="78" width="110" height="52" rx="6" fill="#cfe3ff" stroke="#111" stroke-width="1.5"/>
  <text x="321" y="102" text-anchor="middle" font-size="13" font-weight="600" fill="#111">h</text>
  <text x="321" y="120" text-anchor="middle" font-size="10.5" fill="#333">4bsh</text>
  <!-- h_act -->
  <rect x="440" y="78" width="110" height="52" rx="6" fill="#cfe3ff" stroke="#111" stroke-width="1.5"/>
  <text x="495" y="102" text-anchor="middle" font-size="13" font-weight="600" fill="#111">h_act</text>
  <text x="495" y="120" text-anchor="middle" font-size="10.5" fill="#333">4bsh</text>
  <!-- out (not stored) -->
  <rect x="640" y="78" width="86" height="52" rx="6" fill="#f0f0f0" stroke="#999" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="683" y="102" text-anchor="middle" font-size="13" font-weight="600" fill="#777">out</text>
  <text x="683" y="120" text-anchor="middle" font-size="9.5" fill="#999">not stored</text>

  <!-- arrows with op labels -->
  <line x1="144" y1="104" x2="262" y2="104" stroke="#111" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="203" y="96" text-anchor="middle" font-size="10.5" fill="#555">Wup</text>
  <line x1="376" y1="104" x2="436" y2="104" stroke="#111" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="406" y="96" text-anchor="middle" font-size="10.5" fill="#555">ReLU</text>
  <line x1="550" y1="104" x2="636" y2="104" stroke="#111" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="593" y="96" text-anchor="middle" font-size="10.5" fill="#555">Wdown</text>

  <text x="380" y="180" text-anchor="middle" font-size="12" fill="#333">stored for the backward pass: x, h, h_act  =  9 bsh values</text>
  <text x="380" y="202" text-anchor="middle" font-size="12" fill="#333">in FP16, plus a dropout mask, the FFN costs  <tspan font-weight="600" fill="#111">19 bsh</tspan>  bytes</text>

  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#111"/>
    </marker>
  </defs>
</svg>
